name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Build and push ghcr.io/<owner>/k8scortex-mcp (amd64 + arm64) ────────────
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k8scortex-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          image=ghcr.io/${{ github.repository_owner }}/k8scortex-mcp:sha-${GITHUB_SHA::7}
          docker run -d --name k8scortex -p 3000:3000 -e DISABLE_AUTH=true "$image"
          for _ in $(seq 1 20); do curl -fsS localhost:3000/health && exit 0; sleep 1; done
          docker logs k8scortex; exit 1
