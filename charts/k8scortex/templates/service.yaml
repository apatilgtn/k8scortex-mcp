apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8scortex.fullname" . }}
  labels:
    {{- include "k8scortex.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if gt (int .Values.replicaCount) 1 }}
  # Sessions are held in memory by the pod that created them
  sessionAffinity: ClientIP
  {{- end }}
  selector:
    {{- include "k8scortex.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
