{{- $name := include "k8scortex.fullname" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8scortex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8scortex.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8scortex.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "k8scortex.selectorLabels" . | nindent 6 }}
---
{{- end }}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8scortex.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: k8scortex.availability
      rules:
        - alert: K8sCortexUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment="{{ $name }}"} < 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: K8sCortex has no available replicas
            description: "AI agents and pipelines cannot reach Kubernetes through K8sCortex in {{ .Release.Namespace }}."
        - alert: K8sCortexPodsNotReady
          expr: kube_deployment_status_replicas{namespace="{{ .Release.Namespace }}", deployment="{{ $name }}"} - kube_deployment_status_replicas_ready{namespace="{{ .Release.Namespace }}", deployment="{{ $name }}"} > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: K8sCortex has pods that are not ready
        - alert: K8sCortexRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", pod=~"{{ $name }}-.*"}[30m]) > 2
          labels: { severity: warning }
          annotations:
            summary: K8sCortex pods are restarting
{{- end }}
