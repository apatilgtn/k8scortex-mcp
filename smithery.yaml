name: K8sCortex MCP
description: Production-grade MCP server for Kubernetes — 75 tools across GKE, AKS, EKS, OpenShift and Minikube with RBAC, audit logging, GitOps (ArgoCD + Flux), and multi-cluster support.
license: MIT
qualityScore: production

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      kubeconfig:
        type: string
        description: Path to your kubeconfig file (defaults to ~/.kube/config); each context becomes a cluster
        default: ""
      clustersConfig:
        type: string
        description: Optional path to a cluster registry JSON file (kubeconfig, EKS, GKE, Key Vault)
        default: ""
      roles:
        type: string
        description: Roles for this session, e.g. developer for read-only tools
        default: platform-engineer
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "k8scortex-mcp"],
      env: {
        KUBECONFIG: config.kubeconfig || "",
        CLUSTERS_CONFIG: config.clustersConfig || "",
        K8SCORTEX_STDIO_ROLES: config.roles || "platform-engineer"
      }
    })
