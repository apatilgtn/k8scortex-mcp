# Source: k8scortex/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8scortex
  labels:
    helm.sh/chart: k8scortex-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.1.2"
    app.kubernetes.io/name: k8scortex
    app.kubernetes.io/instance: k8scortex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8scortex
      app.kubernetes.io/instance: k8scortex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8scortex
        app.kubernetes.io/instance: k8scortex
      annotations:
        checksum/clusters: a92ff97a45133f97ac18286d99a5d9f8c64f5b09f000c3c083989ed3832909db
    spec:
      serviceAccountName: k8scortex
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8scortex
          image: "ghcr.io/apatilgtn/k8scortex-mcp:1.1.2"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: PORT, value: "3000" }
            - { name: AUDIT_LOG_FILE, value: "/var/log/k8scortex/audit.log" }
            - { name: SESSION_IDLE_TTL_MS, value: "1.8e+06" }
            - { name: OIDC_ISSUER, value: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0" }
            - { name: OIDC_AUDIENCE, value: "api://k8scortex" }
            - { name: OIDC_ROLES_CLAIM, value: "groups" }
            - { name: OIDC_ROLE_MAP, value: "{\"k8s-developers\":\"developer\",\"k8s-platform\":\"platform-engineer\",\"k8s-release\":\"release-manager\",\"k8s-sre\":\"sre\"}" }
            - { name: CLUSTERS_CONFIG, value: /etc/k8scortex/clusters.json }
            - { name: DEFAULT_CLUSTER, value: "mgmt" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: audit, mountPath: "/var/log/k8scortex" }
            - { name: tmp, mountPath: /tmp }
            - { name: clusters, mountPath: /etc/k8scortex, readOnly: true }
      volumes:
        - { name: audit, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: clusters
          configMap:
            name: k8scortex-clusters
